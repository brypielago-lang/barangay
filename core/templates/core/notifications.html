{% extends 'core/base.html' %}{% block content %}<h2>Notifications</h2><div class="list-group">{% for note in notes %}<a href="{{ note.url|default:'#' }}" class="list-group-item list-group-item-action"><b>{{ note.title }}</b><p class="mb-1">{{ note.message }}</p><small>{{ note.created_at|timesince }} ago</small></a>{% empty %}<p class="text-muted">You have no notifications.</p>{% endfor %}</div>{% endblock %}
