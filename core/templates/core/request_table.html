<div class="table-responsive card"><table class="table mb-0"><thead><tr><th>Reference</th><th>Resident</th><th>Document</th><th>Status</th><th></th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.reference_no }}</td><td>{{ item.resident.full_name }}</td><td>{{ item.get_certificate_type_display }}</td><td><span class="badge text-bg-{{ item.status }}">{{ item.get_status_display }}</span></td><td><a href="{% url 'request_detail' item.pk %}" class="btn btn-sm btn-outline-primary">View</a></td></tr>{% empty %}<tr><td colspan="5" class="text-muted">No records found.</td></tr>{% endfor %}</tbody></table></div>
