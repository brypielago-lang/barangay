{% extends "admin/base.html" %}
{% load static %}

{% block title %}Barangay Maniwaya | Administration{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    :root {
        --navy: #102a43;
        --navy-dark: #0b1f33;
        --blue: #1769d1;
        --blue-light: #eaf2ff;
        --text: #172b4d;
        --muted: #6b7c93;
        --border: #e2e8f0;
        --background: #f5f7fb;
        --white: #ffffff;
        --green: #159447;
        --orange: #e89400;
        --purple: #7048c8;
    }

    html,
    body {
        background: var(--background) !important;
        color: var(--text);
    }

    body {
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif !important;
    }

    /* =========================
       TOP HEADER
       ========================= */

    #header {
        background: linear-gradient(
            120deg,
            #0b1f33,
            #122f50
        ) !important;

        height: 64px !important;
        padding: 0 28px !important;

        display: flex !important;
        align-items: center !important;

        box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }

    #branding {
        display: flex;
        align-items: center;
        min-width: 280px;
    }

    #branding h1 {
        margin: 0 !important;
        padding: 0 !important;
    }

    #branding h1 a {
        color: #ffffff !important;
        font-size: 20px !important;
        font-weight: 700 !important;
        text-decoration: none !important;
        letter-spacing: -.2px;
    }

    #branding h1 a::before {
        content: "🏛️";
        margin-right: 10px;
    }

    #user-tools {
        margin-left: auto !important;
        color: #dbe7f5 !important;
        font-size: 12px !important;
        line-height: 64px !important;
    }

    #user-tools a {
        color: #ffffff !important;
        text-decoration: none !important;
        font-weight: 500;
        margin-left: 16px;
    }

    #user-tools a:hover {
        color: #7db4ff !important;
    }

    /* =========================
       CONTENT
       ========================= */

    #content {
        width: auto !important;
        max-width: 1380px !important;
        margin: 0 auto !important;
        padding: 26px !important;
    }

    #content-main {
        width: 100% !important;
    }

    .breadcrumbs {
        background: transparent !important;
        color: var(--muted) !important;
        padding: 0 0 18px 0 !important;
        font-size: 12px !important;
    }

    .breadcrumbs a {
        color: var(--blue) !important;
    }

    /* =========================
       PAGE TITLES
       ========================= */

    #content h1 {
        color: var(--text) !important;
        font-size: 25px !important;
        font-weight: 700 !important;
        margin: 0 0 20px !important;
    }

    /* =========================
       ADMIN MODULES / TABLES
       ========================= */

    .module,
    .inline-group {
        background: var(--white) !important;
        border: 1px solid var(--border) !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        box-shadow: 0 2px 8px rgba(20,43,77,.04);
    }

    .module h2,
    .module caption,
    .inline-group h2 {
        background: #f7f9fc !important;
        color: var(--text) !important;
        border-bottom: 1px solid var(--border) !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        padding: 13px 17px !important;
    }

    /* =========================
       TABLE
       ========================= */

    #result_list {
        width: 100% !important;
        border-collapse: collapse !important;
        background: #fff !important;
    }

    #result_list thead th {
        background: #f7f9fc !important;
        color: #526581 !important;
        border-bottom: 1px solid var(--border) !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        letter-spacing: .3px;
        padding: 13px 14px !important;
    }

    #result_list tbody tr {
        background: #ffffff !important;
        transition: background .15s ease;
    }

    #result_list tbody tr:hover {
        background: #f6f9ff !important;
    }

    #result_list tbody td,
    #result_list tbody th {
        border-bottom: 1px solid #edf1f5 !important;
        padding: 13px 14px !important;
        font-size: 12px !important;
        color: #263b5a !important;
    }

    #result_list a {
        color: var(--blue) !important;
        font-weight: 600;
        text-decoration: none !important;
    }

    #result_list a:hover {
        color: #0d55ae !important;
    }

    /* =========================
       BUTTONS
       ========================= */

    input[type="submit"],
    button,
    .button,
    a.button {
        border-radius: 7px !important;
        font-weight: 600 !important;
    }

    input[type="submit"],
    .button.default {
        background: var(--blue) !important;
        border: 1px solid var(--blue) !important;
    }

    input[type="submit"]:hover,
    .button.default:hover {
        background: #0f59b7 !important;
    }

    /* =========================
       SEARCH
       ========================= */

    #toolbar {
        background: transparent !important;
        border: none !important;
        padding: 0 0 16px !important;
    }

    #toolbar form {
        display: flex;
        gap: 8px;
    }

    #searchbar {
        border: 1px solid #d7dee8 !important;
        border-radius: 7px !important;
        padding: 9px 12px !important;
        background: #ffffff !important;
    }

    /* =========================
       FORM INPUTS
       ========================= */

    input,
    textarea,
    select {
        border: 1px solid #d7dee8 !important;
        border-radius: 7px !important;
        background: #ffffff !important;
        color: var(--text) !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--blue) !important;
        box-shadow: 0 0 0 3px rgba(23,105,209,.10) !important;
        outline: none !important;
    }

    /* =========================
       PAGINATION
       ========================= */

    .paginator {
        background: #ffffff !important;
        border: 1px solid var(--border) !important;
        border-radius: 0 0 12px 12px !important;
        padding: 12px !important;
        color: var(--muted) !important;
    }

    .paginator a {
        color: var(--blue) !important;
    }

    /* =========================
       ACTION BAR
       ========================= */

    .object-tools a {
        background: var(--blue) !important;
        border-radius: 7px !important;
        padding: 8px 13px !important;
        font-weight: 600 !important;
    }

    .object-tools a:hover {
        background: #0f59b7 !important;
    }

    /* =========================
       MESSAGES
       ========================= */

    .messagelist {
        margin: 0 0 20px !important;
    }

    .messagelist li {
        border-radius: 8px !important;
        padding: 12px 15px !important;
    }

    /* =========================
       FOOTER
       ========================= */

    #footer {
        max-width: 1380px;
        margin: 0 auto;
        padding: 20px 26px !important;
        color: #71809a !important;
        font-size: 11px !important;
        background: transparent !important;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 700px) {

        #header {
            height: auto !important;
            min-height: 64px;
            padding: 12px 16px !important;
            flex-wrap: wrap;
        }

        #branding {
            min-width: auto;
        }

        #user-tools {
            line-height: normal !important;
            margin-top: 8px !important;
            width: 100%;
        }

        #content {
            padding: 16px !important;
        }

        #result_list {
            display: block;
            overflow-x: auto;
        }
    }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
    <h1>
        <a href="{% url 'admin:index' %}">
            Barangay Maniwaya
        </a>
    </h1>
</div>
{% endblock %}

{% block nav-global %}
{% endblock %}
